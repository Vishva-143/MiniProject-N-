{% extends "base.html" %}
{% block title %}Add Marks{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Quick Add Marks</h2>
    <div class="card p-4 bg-secondary">
        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Class</label>
                <select id="class" class="form-control">
                    <option value="">Select class</option>
                    {% for cls in classes %}
                    <option value="{{ cls.id }}">{{ cls.class_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label>Student</label>
                <select id="student" class="form-control" disabled>
                    <option>Select class first</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label>Subject</label>
                <select id="subject" class="form-control" disabled>
                    <option>Select student first</option>
                </select>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-4">
                <label>Internal 1 (out of 40)</label>
                <input type="number" id="exam1" class="form-control" min="0" max="40">
            </div>
            <div class="col-md-4">
                <label>Internal 2 (out of 40)</label>
                <input type="number" id="exam2" class="form-control" min="0" max="40">
            </div>
            <div class="col-md-4">
                <label>Internal 3 (out of 40)</label>
                <input type="number" id="exam3" class="form-control" min="0" max="40">
            </div>
        </div>

        <button onclick="saveMarks()" class="btn btn-primary mt-3">Save Marks</button>
        <div id="marks-result" class="mt-3"></div>
    </div>
</div>

<script>
function setStudentPlaceholder(message) {
    const select = document.getElementById('student');
    select.innerHTML = `<option>${message}</option>`;
    select.disabled = true;
}

function setSubjectPlaceholder(message) {
    const select = document.getElementById('subject');
    select.innerHTML = `<option>${message}</option>`;
    select.disabled = true;
}

document.getElementById('class').addEventListener('change', function() {
    const classId = this.value;
    setStudentPlaceholder('Loading students...');
    setSubjectPlaceholder('Select student first');
    if (!classId) {
        setStudentPlaceholder('Select class first');
        return;
    }
    fetch(`/get_students_for_class/${classId}`)
        .then(r => r.json())
        .then(data => {
            const stuSel = document.getElementById('student');
            stuSel.innerHTML = '';
            const students = data.students || [];
            if (!students.length) {
                setStudentPlaceholder('No students found');
                return;
            }
            students.forEach(stu => {
                let opt = new Option(stu.name, stu.student_id);
                stuSel.add(opt);
            });
            stuSel.disabled = false;
            setSubjectPlaceholder('Select student first');
        })
        .catch(err => {
            console.error(err);
            setStudentPlaceholder('Error loading students');
        });
});

document.getElementById('student').addEventListener('change', function() {
    const studentId = this.value;
    setSubjectPlaceholder('Loading subjects...');
    if (!studentId) {
        setSubjectPlaceholder('Select student first');
        return;
    }
    fetch(`/get_subjects_for_student/${studentId}`)
        .then(r => r.json())
        .then(data => {
            const subjectSel = document.getElementById('subject');
            subjectSel.innerHTML = '';
            const subjects = data.subjects || [];
            if (!subjects.length) {
                setSubjectPlaceholder('No subjects available');
                return;
            }
            subjects.forEach(sub => {
                let opt = new Option(sub.subject_name, sub.id);
                subjectSel.add(opt);
            });
            subjectSel.disabled = false;
        })
        .catch(err => {
            console.error(err);
            setSubjectPlaceholder('Error loading subjects');
        });
});

function saveMarks() {
    const studentId = document.getElementById('student').value;
    const subjectId = document.getElementById('subject').value;
    if (!studentId || !subjectId) {
        document.getElementById('marks-result').innerHTML = '<div class="alert alert-danger">Please select class, student, and subject before saving marks.</div>';
        return;
    }
    let data = {
        student_id: studentId,
        subject_id: subjectId,
        internal_exam_1: parseInt(document.getElementById('exam1').value) || 0,
        internal_exam_2: parseInt(document.getElementById('exam2').value) || 0,
        internal_exam_3: parseInt(document.getElementById('exam3').value) || 0
    };
    fetch('/add_marks', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    }).then(r => r.json()).then(res => {
        const result = document.getElementById('marks-result');
        if (res.success) {
            result.innerHTML = '<div class="alert alert-success">Marks saved successfully.</div>';
        } else {
            result.innerHTML = '<div class="alert alert-danger">Error: ' + (res.error || 'Unable to save marks') + '</div>';
        }
    }).catch(err => {
        console.error(err);
        document.getElementById('marks-result').innerHTML = '<div class="alert alert-danger">Network error: failed to save marks.</div>';
    });
}
</script>
{% endblock %}
